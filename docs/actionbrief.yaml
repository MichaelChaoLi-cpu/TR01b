  fig_spatial_distribution_of_potential_mismatch:
    figureId: fig_spatial_distribution_of_potential_mismatch
    figurePath: data/results/figures/Figure_spatial_distribution_of_potential_mismatch.png
    figureCaption: Spatial Distribution of Potential Mismatch
    figurePanelCount: 2
    figureNote: "Panel a maps supported high-road/low-radiance candidates, supported noncandidates and unavailable screening in 2024. Panel b shows dominant UMD land context only for candidate meshes, with other analytical meshes muted. Screening uses unchanged comparable-context peer rules and support thresholds. Candidate context counts are not within-context candidate rates; valid zero radiance and unavailable screening remain distinct. Candidates identify relative patterns rather than confirmed excessive or unused roads."
    figureAim: Locate supported potential mismatch candidates in 2024, distinguish unsupported screening from supported
      noncandidates, and color candidate meshes only by their UMD land context in the companion map.
    figureExplanation: Spatial Distribution of Potential Mismatch. Panel a locates relative high-road/low-radiance
      candidates, supported noncandidates and unavailable screening in 2024. Panel b colors only the 66,097 candidate
      meshes by dominant UMD land context; the other 317,289 analytical meshes remain pale-gray background, including
      both supported noncandidates and unavailable screening. The two panels retain the same complete 383,386-mesh
      footprint. Road and light years are 2024; matched Population is from 2020. Peer groups are Region, Population
      band (0, 1-9, 10-49, 50-199, 200-999, 1000-4999, 5000+), dominant Land Context, presence of any selected school,
      medical, logistics or visitor/event facility, and Railway Station distance (<1 km, 1-<5 km, >=5 km). A peer
      group is supported if it contains at least thirty distinct meshes and maximum radiance exceeds zero. A candidate
      has positive Road Length Density strictly above its peer 75th percentile and Nighttime Radiance at or below
      its peer 25th percentile, using linear-interpolation quartiles. Thresholds and non-land peer bands are unchanged
      from the accepted IGBP screening; UMD dominant context and its peer quartiles are reconstructed under MILI-D-20261011-027.
      The candidate-only thematic display is selected under MILI-D-20261011-028; no screening values or candidate
      identities are changed. Panel b legend counts refer only to candidates, not whole-cohort land area or within-context
      candidate rates. Barren has zero candidates because all thirty-four Barren-context meshes lack peer support;
      this is not evidence of no potential mismatch in Barren areas. UMD shares represent Forest (classes 1-5),
      Shrublands and Grasslands (6-10), Cropland (12), Urban (13), Water (0) and Barren (15, including permanent
      snow/ice). Largest full-mesh share determines context; ties within 1e-12 remain distinct, and incomplete coverage
      overrides dominance. No tied context is observed; all 104 incomplete-coverage meshes are retained. There are
      376,219 supported meshes, 66,097 candidates (17.57% of supported meshes) and 7,167 unavailable indicators.
      Of candidates, 64,034 (96.88%) have valid numerical zero radiance. These values are retained; they do not
      establish zero economic activity. Nighttime Radiance proxies broader economic activity. Red candidates are
      relative empirical patterns, not confirmed road overprovision, unused roads, causal effects or measured maintenance
      liabilities. Screening is distinct from the GWPR coefficient surface. Dark gray in panel a indicates unsupported
      screening; dark gray in panel b indicates fourteen candidate meshes with incomplete land-cover coverage. Pale
      gray in panel b marks other analytical meshes without a thematic context color. Pale blue is ocean, and light
      gray land is geographic context outside the analytical cohort. Actual third-order mesh rectangles measure
      1/120 degree latitude by 1/80 degree longitude; no smoothing, interpolation or additional land mask is applied.
      Southwest and Ogasawara insets use separate scales. Four original Minamitorishima meshes with unavailable
      land cover remain outside the unchanged extended cohort; source rows are preserved. All-zero-light groups
      and fewer-than-thirty-mesh groups are unavailable, never coded as noncandidates. Current municipal comparisons
      use the independently validated UMD screen reconciliation with unchanged government assignments, traffic and
      fiscal inputs; earlier IGBP municipal results remain historical provenance. Export is 600 dpi.
