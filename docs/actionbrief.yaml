doc_type: actionbrief
version: 0.1.0
datasetDictionary:
  road_products:
    datasetSourceName: KSJ historical road mesh products and 2024 road centerlines
    datasetDescription: Source-defined road provision, including historical supplied density and recent ordinary-centerline
      length.
    datasetAttribute: table
    datasetProvider: Ministry of Land, Infrastructure, Transport and Tourism, Japan; National Land Numerical Information
      (KSJ).
    datasetGenerationInfo: Official road mesh attributes for historical snapshots and selected ordinary-road centerline
      geometry for 2024.
    datasetPeriod: 2002, 2003, 2004, 2010 and 2024
    datasetScale: Japan nationwide source scope; study results are conditional on the documented analytical cohort.
    datasetSpatialResolution: Historical standard approximately 1 km mesh; recent lines aggregated to the same mesh.
    datasetTemporalResolution: Irregular source snapshots; no annual reconstruction.
    datasetPreprocessingInfo: Supplied normalized metres per square kilometre converted once to km/km2; recent length
      divided by full projected mesh area. Approved source-unlisted/unknown density-only zeros retain flags; original
      length and area missingness is preserved. The documented 2010 length repair does not change supplied density.
      Cross-period source equivalence remains unresolved.
    retainedPaths:
    - data/exp/data-preprocessing/national/decisions.json
    - data/exp/data-preprocessing/road-density-zero/decisions.json
    - data/processed/national/road_density_zero/roads_2024_preprocessed.parquet
  census_population:
    datasetSourceName: Population Census standard mesh totals
    datasetDescription: Total residents of both sexes and all ages at the actual census year.
    datasetAttribute: table
    datasetProvider: Statistics Bureau of Japan, Ministry of Internal Affairs and Communications; e-Stat statistical
      GIS.
    datasetGenerationInfo: Official Population Census mesh tabulations.
    datasetPeriod: 2000, 2005, 2010 and 2020; matched as 2000, 2005, 2005, 2010, 2020
    datasetScale: Japan nationwide source scope; study results are conditional on the documented analytical cohort.
    datasetSpatialResolution: Standard approximately 1 km statistical mesh
    datasetTemporalResolution: Five-year census snapshots; 2005 is used twice.
    datasetPreprocessingInfo: Absent mesh records within verified complete census archives are structural zeros;
      entire archive gaps remain missing. Preserve actual years, disclosure references and census offsets; no statistical
      imputation.
    retainedPaths:
    - data/exp/data-preprocessing/population-zero-correction/decisions.json
    - data/processed/national/five_period/population_2020_preprocessed.parquet
  nighttime_light:
    datasetSourceName: The global NPP-VIIRS-like nighttime light data (Version 2) for 1992-2025
    datasetDescription: Harmonized VIIRS-like annual radiance used as a proxy for broader economic activity.
    datasetAttribute: table
    datasetProvider: Zuoqi Chen, Bailang Yu and coauthors; published through Harvard Dataverse, DOI 10.7910/DVN/YGIVCD.
    datasetGenerationInfo: Research-derived global VIIRS-like nighttime-light raster product, Version 2; acquired
      dataset edition 10.1.
    datasetPeriod: Product 1992-2025; study uses 2002, 2003, 2004, 2010 and 2024
    datasetScale: Japan nationwide source scope; study results are conditional on the documented analytical cohort.
    datasetSpatialResolution: Native WGS84 raster spacing approximately 0.0044916 degrees; valid pixels aggregated
      to standard 1 km meshes.
    datasetTemporalResolution: Annual rasters; selected irregular road years.
    datasetPreprocessingInfo: Use year-specific georeferencing and valid pixel/mesh intersection-area-weighted mean.
      Retain true zeros, exclude declared nodata; no logarithm, clipping, interpolation or land mask. Radiance is
      not calibrated GDP and zero is not measured zero economic activity.
    retainedPaths:
    - data/exp/data-organization/source-metadata/2026-10-08/datacite.json
    - data/exp/data-organization/tables/nighttime_raster_metadata.json
    - data/processed/national/five_period/lights_2024_preprocessed.parquet
  land_cover:
    datasetSourceName: MODIS MCD12Q1 Collection 6.1 LC_Type2 UMD classification
    datasetDescription: Annual six-group land-cover area shares and latest dominant land context.
    datasetAttribute: table
    datasetProvider: NASA MODIS land-cover product, distributed through NASA data services; retained catalogue and
      quality metadata.
    datasetGenerationInfo: Annual satellite land-cover classification; LC_Type2 uses the University of Maryland
      legend.
    datasetPeriod: 2002, 2003, 2004, 2010 and 2024
    datasetScale: Japan nationwide source scope; study results are conditional on the documented analytical cohort.
    datasetSpatialResolution: Nominal 500 m MODIS pixels; geometric intersections with full 1 km mesh footprints.
    datasetTemporalResolution: Annual land-cover snapshots matched to each study period.
    datasetPreprocessingInfo: Forest 1-5, Shrublands and Grasslands 6-10, Cropland 12, Urban 13, Water 0, Barren
      15 including snow/ice. Accept the approved source quality states and mask-identified water. Exclude unresolved
      land; preserve incomplete coverage without renormalization. Water is the regression reference. The unpublished
      tile leaves four source-unavailable cohort meshes.
    retainedPaths:
    - data/exp/data-preprocessing/modis-umd/decisions.json
    - data/exp/data-preprocessing/modis-umd/grouping_decisions.json
    - data/processed/national/modis_umd/modis_umd_land_cover_mesh_preprocessed.parquet
    - data/processed/national/modis_umd/mismatch_context_2024_preprocessed.parquet
  static_facilities:
    datasetSourceName: Selected KSJ station, airport, school, medical, logistics and visitor inventories
    datasetDescription: Six selected facility controls and four source-location categories used in the spatial foundation
      figure.
    datasetAttribute: table
    datasetProvider: Ministry of Land, Infrastructure, Transport and Tourism, Japan; National Land Numerical Information
      (KSJ).
    datasetGenerationInfo: Official feature inventories, with approved station grouping, passenger-terminal selection
      and category-specific duplicate rules.
    datasetPeriod: Railway 2024; airport 2021; school 2023; medical 2020; logistics 2013; visitor/event 2014
    datasetScale: Japan nationwide source scope; study results are conditional on the documented analytical cohort.
    datasetSpatialResolution: Original source features; counts per 1 km mesh and geodesic distances from mesh centroids
      in km.
    datasetTemporalResolution: One selected edition per category, replicated unchanged across all five periods under
      the approved static assumption.
    datasetPreprocessingInfo: Retain selected totals, exact deduplication rules, observed-location coverage and
      source provenance. Use six focused controls; do not add component counts, bus candidates or the eighteen supplementary
      inventories to the confirmed equation. Point-map coordinates are geographic references, not additional predictors.
      The source snapshots do not reconstruct historical openings.
    retainedPaths:
    - data/exp/data-preprocessing/static-facilities/decisions.json
    - data/exp/data-preprocessing/static-facilities/source_inventory_validation.json
    - data/processed/national/static_facilities/static_facility_mesh_preprocessed.parquet
  administrative_geography:
    datasetSourceName: Frozen KSJ administrative boundary and study mesh assignments
    datasetDescription: Nine transportation-statistics regions, forty-seven prefectures and municipal financial-government
      linkage.
    datasetAttribute: table
    datasetProvider: MLIT National Land Numerical Information administrative polygons; project-derived allocation
      using verified government codes.
    datasetGenerationInfo: Greatest positive projected land-overlap allocation, held fixed across periods; designated-city
      wards consolidate to financial parent.
    datasetPeriod: Frozen boundary reference 2024-01-01; 2021 Shizuoka reference for verified historical ward-code
      linkage.
    datasetScale: Japan nationwide source scope; study results are conditional on the documented analytical cohort.
    datasetSpatialResolution: Administrative polygons intersected with 1 km mesh footprints
    datasetTemporalResolution: Fixed spatial classification throughout the five-period study.
    datasetPreprocessingInfo: Retain islands, nineteen reviewed no-overlap exceptions and cross-boundary flags.
      Municipality allocation is restricted to the frozen prefecture. Keep 320 unlinked meshes missing; this is
      territorial allocation, not road ownership or exact clipping.
    retainedPaths:
    - data/exp/data-preprocessing/regional/reference/manifest.json
    - data/processed/national/municipality_mismatch_trial/mesh_municipality_reference_preprocessed.parquet
  traffic_survey:
    datasetSourceName: 2021 Road Traffic Census territorial survey summaries
    datasetDescription: Published 24-hour vehicle volumes averaged over positive-length surveyed major-road segments
      within government territories.
    datasetAttribute: table
    datasetProvider: Ministry of Land, Infrastructure, Transport and Tourism, Japan; official Road Traffic Census
      sources.
    datasetGenerationInfo: Official basic survey segments and published daily vehicle volumes; retained source-manager
      and road-type references.
    datasetPeriod: '2021'
    datasetScale: Japan nationwide source scope; study results are conditional on the documented analytical cohort.
    datasetSpatialResolution: Survey segments aggregated by source municipality codes to the financial-government
      crosswalk.
    datasetTemporalResolution: Single observed cross-section; not replicated into the radiance panel.
    datasetPreprocessingInfo: Length-weight available volumes using basic-segment lengths and verified code linkage;
      retain estimated-volume flags and missing outcomes. Most ordinary municipal roads are outside the survey.
      Seven government outcomes remain missing.
    retainedPaths:
    - data/processed/national/municipality_mismatch_trial/municipal_traffic_reference_preprocessed.parquet
    - data/exp/data-preprocessing/municipality-mismatch-trial/decisions.json
  municipal_finance:
    datasetSourceName: Local Public Finance Survey municipal fiscal accounts
    datasetDescription: Realized road-plus-bridge maintenance, expenditure, standard fiscal scale, revenue and need
      for individual financial governments.
    datasetAttribute: table
    datasetProvider: Ministry of Internal Affairs and Communications, Japan; Local Public Finance Survey distributed
      through e-Stat.
    datasetGenerationInfo: Official financial accounts and source templates, with verified purpose rows, fiscal-year
      labels and thousand-JPY units.
    datasetPeriod: Actual FY2023, despite the source catalogue's 2024 label
    datasetScale: Japan nationwide source scope; study results are conditional on the documented analytical cohort.
    datasetSpatialResolution: 1,741 individual municipal financial governments
    datasetTemporalResolution: Single fiscal-year cross-section; not repeated into the five-period radiance models.
    datasetPreprocessingInfo: Combine disjoint road and bridge maintenance child rows; exclude capital construction
      and entrusted-work columns. Calculate maintenance/expenditure, maintenance/fiscal-scale and single-year standard
      revenue/need. Do not decode or substitute the three-year strength index. These are realized spending ratios,
      not maintenance requirements.
    retainedPaths:
    - data/processed/national/municipality_mismatch_trial/municipal_fiscal_reference_preprocessed.parquet
    - data/exp/municipality-mismatch-trial/source_inventory.csv
  national_model_panel:
    datasetSourceName: Validated UMD common-cohort analytical panel
    datasetDescription: Source-linked mesh-period data underlying the same-sample baseline, extended administrative
      and local comparisons.
    datasetAttribute: table
    datasetProvider: Project construction from the documented official and satellite source families.
    datasetGenerationInfo: Mesh-key joins, approved source coding, geographic assignment and complete focused-control
      selection.
    datasetPeriod: Road/light/land 2002, 2003, 2004, 2010, 2024; population 2000, 2005, 2005, 2010, 2020
    datasetScale: Japan nationwide source scope; study results are conditional on the documented analytical cohort.
    datasetSpatialResolution: 383,386 approximately 1 km meshes; 1,916,930 records
    datasetTemporalResolution: Five irregular snapshots; static facility replication.
    datasetPreprocessingInfo: Processed candidate data contain 383,390 meshes and twenty land-cover-unavailable
      records. The frozen analytical snapshot excludes only those four meshes from the same-sample comparison. Full
      source-derived panel retains 4,864,000 records. Original units, valid zeros and source-year references remain;
      no fixed effects or analytical logarithms.
    retainedPaths:
    - data/processed/national/modis_umd/association_candidate_panel_preprocessed.parquet
    - data/exp/umd-four-layer/inputs/model_panel.parquet
    - data/exp/umd-four-layer/execution_contract.json
  mismatch_screen:
    datasetSourceName: Validated 2024 UMD comparable-context screen
    datasetDescription: Nullable relative high-road/low-radiance candidate status and land-context summaries for
      the current mesh cohort.
    datasetAttribute: table
    datasetProvider: Project-derived descriptive screen using the validated national model panel and annual UMD
      shares.
    datasetGenerationInfo: Preselected peers defined by region, population band, dominant land context, selected
      facility presence and railway proximity.
    datasetPeriod: Road/light/land 2024; population 2020
    datasetScale: Japan nationwide source scope; study results are conditional on the documented analytical cohort.
    datasetSpatialResolution: 383,386 meshes; 376,219 supported comparisons; 66,097 candidates
    datasetTemporalResolution: Latest-period cross-section; distinct from the local coefficient surface.
    datasetPreprocessingInfo: Require at least thirty peer meshes and positive peer maximum radiance. Positive road
      density strictly above peer Q75 and radiance at or below peer Q25 defines a candidate; use linear quartiles.
      Keep 7,167 unsupported indicators missing. Zero radiance is retained. This screen does not classify confirmed
      excessive stock, economic inactivity or unused roads.
    retainedPaths:
    - data/exp/umd-mismatch-screen/mesh_screen_2024.parquet
    - data/processed/national/modis_umd/mismatch_context_2024_preprocessed.parquet
    - data/exp/umd-mismatch-screen/validation.json
  municipal_evidence:
    datasetSourceName: Validated UMD municipal mismatch, traffic and fiscal evidence
    datasetDescription: Municipal and land-context candidate fractions linked to existing traffic and fiscal outcomes.
    datasetAttribute: table
    datasetProvider: Project-derived reconciliation of UMD screening, frozen government linkage and verified official
      outcomes.
    datasetGenerationInfo: Aggregate supported and candidate mesh counts to financial governments and compare pairwise
      available outcomes.
    datasetPeriod: Road/light/land 2024; population 2020; traffic 2021; actual fiscal year 2023
    datasetScale: Japan nationwide source scope; study results are conditional on the documented analytical cohort.
    datasetSpatialResolution: 1,741 governments; 1,734 usable traffic outcomes; 383,386-mesh jurisdiction ledger
    datasetTemporalResolution: Linked cross-section with noncontemporaneous source dates.
    datasetPreprocessingInfo: 66,059 candidates link to governments and 38 remain unlinked; preserve the full ledger.
      Context-specific fractions pair with whole-government outcomes. Keep zero-denominator contexts unavailable.
      Traffic and own-government spending are not matched by road ownership; no causal fiscal model is estimated.
    retainedPaths:
    - data/exp/umd-municipal-context/municipal_evidence_2024.parquet
    - data/exp/umd-municipal-context/municipal_mesh_ledger_2024.parquet
    - data/exp/umd-municipal-context/municipal_context_rank_correlations.csv
    - data/exp/umd-municipal-context/validation.json
