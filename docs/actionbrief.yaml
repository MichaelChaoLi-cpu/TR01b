  fig_regional_road_associations:
    figureId: fig_regional_road_associations
    figurePath: data/results/figures/Figure_regional_road_associations.png
    figureCaption: Regional Road Associations
    figurePanelCount: 2
    figureNote: "Panel a compares baseline and extended pooled road-density coefficients across nine transportation-statistics Regions, with individual mesh-clustered CR1 95 percent intervals. Stepped dashed connectors display coefficient changes without testing those changes. Panel b maps extended coefficients over regional polygons on a zero-centered diverging scale. Both models use identical area-specific five-period samples, with an intercept and no fixed effects; associations are conditional rather than causal."
    figureAim: Compare baseline and extended road-density coefficients with individual mesh-clustered 95 percent
      intervals across nine Regions in a forest panel and locate the extended associations in an administrative-area
      map; distinguish unavailable estimates.
    figureExplanation: Regional Road Associations. Panel a compares baseline (circles) and extended (diamonds) original-scale
      pooled road-density coefficients, with Nighttime Radiance as the outcome, and individual normal 95 percent
      intervals from mesh-clustered CR1 covariance using the actual retained parameter count. Baseline controls
      for Population; the extension adds the five selected annual UMD land-cover shares, railway/airport distances
      and four selected facility counts. Both include an intercept and no fixed effects, on identical area-specific
      samples from 383,386 meshes and 1,916,930 records. The five road/light periods are 2002, 2003, 2004, 2010
      and 2024; census matches are 2000, 2005, 2005, 2010 and 2020. Road coefficients have radiance units (nW/cm2/sr)
      per km/km2 of road density. Forest intervals are not truncated; the forest horizontal scale differs between
      the regional and prefecture figures to retain readability. Gray dashed stepped connectors have a horizontal
      segment centered between the two model point heights and vertical end segments joining their markers, showing
      the coefficient change after adding controls; they are not confidence intervals or significance tests of the
      change. Areas with unavailable extended fits have no connector. Panel b colors the extended coefficient over
      frozen 2024 official administrative polygons; regional polygons follow the accepted nine-region transportation-statistics
      grouping. Both administrative maps use the same continuous linear blue-green-white-yellow-red scale from -0.25
      to 0.25, with white exactly at zero, without clipping coefficients. The three-item model and connector legend
      is stacked directly below panel a; the prefecture and regional figures use the same 18 by 14 inch canvas and
      panel geometry. Panel a is narrow and tall; panel b has approximately 2.59 times its plotting width. Both
      plotting panels have identical vertical lengths and aligned upper and lower edges. Map geometry retains its
      geographic aspect ratio. Fills represent area-level conditional slopes, not mesh-specific estimates or a statement
      of complete within-area sample coverage. Maps do not encode significance. Gray represents unavailable extended
      fits if any; all nine regional and all forty-seven prefecture extended fits are available in this UMD delivery,
      including Tokyo and Nara. Water is the omitted land-cover reference. The included UMD categories are Urban,
      Forest, Cropland, Shrublands and Grasslands (classes 6-10), and Barren (class 15). Constant or redundant added
      controls are omitted while retaining their nuisance column space; the road and population coefficients must
      remain identifiable. Nara omits constant Barren and redundant Shrublands and Grasslands; its road coefficient
      remains estimable. Display geometry is dissolved then simplified at 0.005 degrees; source geometry and analytical
      assignments are unchanged. Southwest and Ogasawara insets use separate scales; views follow the analytical
      map extents, and remote land outside these views is not shown. Pale blue denotes ocean. Intervals are unadjusted
      for multiple comparisons and are not formal between-area difference tests. Conditional associations do not
      establish causal effects or excessive provision. Export is 600 dpi.
