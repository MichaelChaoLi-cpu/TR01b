figureDictionary:
  fig_spatial_distribution_of_key_variables:
    figureId: fig_spatial_distribution_of_key_variables
    figurePath: data/results/figures/Figure_spatial_distribution_of_key_variables.png
    figureCaption: Spatial Distribution of Key Variables
    figurePanelCount: 4
    figureNote: "Panels a-c map equal-weight means of Road Length Density, matched Population and Nighttime Radiance over five observed periods. Panel d maps selected medical, school, visitor/event and logistics source-location records. Means are observation means rather than continuous annual averages; facility snapshots are static. Exact zero means are gray, and positive values use separate piecewise-linear color scales. Mesh footprints and island insets are retained."
    figureAim: Establish the spatial context of road provision and economic activity using five-period mesh means
      of Road Length Density, Population and Nighttime Radiance, plus source-location points for the four selected
      facility snapshots.
    figureExplanation: 'Spatial distribution of key variables. Panels a-c show equal-weight means over the 2002,
      2003, 2004, 2010 and 2024 road/light observations: road length density, matched population and NTL radiance.
      Population snapshots are 2000, 2005, 2005, 2010 and 2020. These are observation means, not continuous annual
      averages. Actual standard mesh footprints are drawn without interpolation. Gray cells denote valid zero means;
      positive values use the same continuous blue-green-yellow-red palette, with a separate numerical scale and
      units for each variable. To show detail in the skewed distributions, color positions are piecewise-linear
      functions of the original values; successive labeled ticks occupy equal colorbar space. The scales are nonlinear
      overall, and no analytical values are transformed or clipped. The blue endpoint marked 0+ denotes the limit
      of positive values; exact zeros are gray. Road density and population ticks are integers; NTL retains fractional
      ticks for low radiance. Geographic gridlines are drawn in all main maps and insets; the PNG is exported at
      600 dpi. Panel d draws the retained source-location records for medical facilities (2020), schools (2023),
      visitor/event facilities (2014) and logistics facilities (2013), using the accepted within-category selection
      and duplicate rules. Points are restricted to the same 383,386 analytical meshes, are not relocated or jittered,
      and can overlap. The facility display is not a comprehensive POI inventory or a cross-category count of unique
      institutions. Pale blue map backgrounds represent the ocean. Light land shading is geographic context outside
      the analytical footprints. Main-island, southwest and Ogasawara views have identical extents across panels;
      the island insets use separate scales. Four Minamitorishima meshes remain outside the approved extension because
      land cover is unavailable. Source road definitions and population timing remain as documented.'
    figureSuitableSection: Data and study context
    title: Spatial Distribution of Key Variables
