  fig_local_road_associations_across_japan:
    figureId: fig_local_road_associations_across_japan
    figurePath: data/results/figures/Figure_local_road_associations_across_japan.png
    figureCaption: Local Road Associations across Japan
    figurePanelCount: 1
    figureNote: "The main-text mesh map displays extended geographically weighted pooled road-density coefficients using a 5 km fixed bisquare radius. Gray indicates unavailable fits. Colors saturate at plus or minus 0.30 while numerical coefficients remain unchanged. No local uncertainty or significance is encoded. The companion Appendix map documents estimation support."
    figureAim: Main-text figure showing spatial variation in extended geographically weighted pooled road-density
      coefficients, distinguishing unavailable fits from zero slopes.
    figureExplanation: 'Local Road Associations across Japan. This independent main-text figure shows the extended
      geographically weighted pooled road-density coefficient surface. The coefficient is conditional on Population,
      five annual UMD land-cover shares and six selected static facility/accessibility controls. Water is the omitted
      land-cover reference. UMD classes 6-10 form Shrublands and Grasslands and class 15 is Barren. Constant or
      redundant nuisance controls are omitted while retaining their column space; road and population must remain
      identifiable. An intercept is included; no fixed effects are included. Nighttime Radiance proxies broader
      economic activity. The five road/light periods are 2002, 2003, 2004, 2010 and 2024, with census matches 2000,
      2005, 2005, 2010 and 2020. Coefficients have radiance units (nW/cm2/sr) per km/km2 of road density. The 5
      km fixed-distance bisquare kernel uses great-circle centroid distances. Bandwidth selection used whole-mesh
      holdout on identical estimable validation support: 985 of 1,282 sampled centers, representing 75.25 percent
      of tile expansion weight. This is an approximate optimum conditional on that support, not a verified national
      optimum. Final fits include the focal mesh. All 383,386 complete-case focal meshes appear in this figure:
      357,316 estimable and 26,070 non-estimable. Gray marks non-estimable fits, not zero coefficients. Pale blue
      denotes ocean; light gray land is display context without a model estimate. Mesh rectangles are 1/120 degree
      latitude by 1/80 degree longitude, with no interpolation or additional land mask. Southwest and Ogasawara
      insets use separate scales. Four original-source Minamitorishima meshes lack land cover and are absent from
      this common estimation cohort; their source rows remain retained. Of the unavailable fits, 23,837 have constant
      mandatory road or population terms and 2,233 have an unidentifiable retained design. No local uncertainty
      or significance shading is provided. Associations neither identify causality nor prove excessive road provision.
      Export is 600 dpi.

      The continuous blue-green-white-yellow-red color scale is centered at zero and saturates at ±0.30; this rounds
      the 98th percentile of absolute coefficients (0.291658) upwards to a 0.05 increment. Only colors saturate
      for 6,562 meshes; all numerical coefficients remain unchanged. The original coefficient range is -9404.490615
      to 3.621047. The 9,936 exact zero slopes appear white. The companion appendix figure, Local Road Association
      Estimation Support, documents neighborhood availability and retains the twenty-four estimable neighborhoods
      below thirty observation records.'
