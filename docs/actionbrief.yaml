      no fixed effects are included. Nighttime Radiance proxies broader economic activity. The five road/light periods
      are 2002, 2003, 2004, 2010 and 2024, with census matches 2000, 2005, 2005, 2010 and 2020. Coefficients have
      radiance units (nW/cm2/sr) per km/km2 of road density. The 5 km fixed-distance bisquare kernel uses great-circle
      centroid distances. Bandwidth selection used whole-mesh holdout on identical estimable validation support:
      985 of 1,282 sampled centers, representing 75.25 percent of tile expansion weight. This is an approximate
      optimum conditional on that support, not a verified national optimum. Final fits include the focal mesh. All
      383,386 complete-case focal meshes appear in this figure: 357,316 estimable and 26,070 non-estimable. Gray
      marks non-estimable fits, not zero coefficients. Pale blue denotes ocean; light gray land is display context
      without a model estimate. Mesh rectangles are 1/120 degree latitude by 1/80 degree longitude, with no interpolation
      or additional land mask. Southwest and Ogasawara insets use separate scales. Four original-source Minamitorishima
      meshes lack land cover and are absent from this common estimation cohort; their source rows remain retained.
      Of the unavailable fits, 23,837 have constant mandatory road or population terms and 2,233 have an unidentifiable
      retained design. No local uncertainty or significance shading is provided. Associations neither identify causality
      nor prove excessive road provision. Export is 600 dpi.

      Dark teal marks 357,292 estimable focal meshes with at least thirty observation records; orange marks the
      twenty-four estimable focal meshes below thirty records. All estimable neighborhoods, including exact zero
      road slopes, receive an estimable support color. The threshold counts pooled observation records, not independent
      meshes. With five records per mesh, thirty records correspond to six positive-weight meshes; it is not an
      effective-weight sample-size threshold. Gray marks all 26,070 unavailable fits; support colors encode neither
      road coefficient signs nor significance. Full numerical estimates are unchanged.'
