  fig_municipal_mismatch_traffic_and_fiscal_context:
    figureId: fig_municipal_mismatch_traffic_and_fiscal_context
    figurePath: data/results/figures/Figure_municipal_mismatch_traffic_and_fiscal_context.png
    figureCaption: Municipal Mismatch, Traffic and Fiscal Context
    figurePanelCount: 3
    figureNote: "Panels a-c relate municipal potential-mismatch fractions to territorial surveyed twenty-four-hour traffic, own-government road-plus-bridge maintenance spending as a share of expenditure, and the single-year standard fiscal revenue/need ratio. Three panels occupy a two-by-two canvas with the fourth slot empty. Each reports available pair counts, Spearman and Pearson correlations, and conventional Pearson p values; dashed lines are original-scale single-predictor OLS summaries. Traffic and fiscal measures are not matched by road ownership. These cross-sectional comparisons do not measure candidate-road costs or causal fiscal effects."
    figureAim: Describe how current UMD municipal candidate fractions relate to surveyed traffic, maintenance shares
      of expenditure and fiscal resources in three scatter panels arranged on a two-by-two canvas with the fourth
      slot empty; show original-scale OLS dashed lines, pairwise available counts, descriptive Spearman correlations,
      and Pearson coefficients with conventional two-sided p values.
    figureExplanation: Municipal Mismatch, Traffic and Fiscal Context. Each point is an individual municipal financial
      government (city, town, village or Tokyo special ward); designated-city administrative wards are consolidated
      to the financial parent. The horizontal axis is the percentage of assigned supported UMD comparison meshes
      that are potential mismatch candidates. Panel a shows segment-length-weighted surveyed twenty-four-hour traffic
      in the territory; panel b own-government road-plus-bridge maintenance spending as a percentage of total expenditure;
      panel c the single-year standard fiscal revenue/need ratio. Panels report pairwise available counts and unadjusted
      descriptive Spearman correlations, Pearson correlations and conventional two-sided Pearson p values for the
      null of zero linear correlation. Pearson tests assume independent bivariate-normal pairs and are not adjusted
      for spatial dependence or multiple comparisons; p values do not refer to Spearman coefficients. Values below
      0.1 percent are displayed as p < 0.1%; exact computed values remain in the verification record. Small p values
      do not establish large associations or causality. Black dashed lines show unweighted, single-predictor OLS
      fits with an intercept on each panel's available pairs, using original outcome values. Fits span the observed
      predictor range, without controls, confidence bands or separate fitted-line tests. The unconstrained traffic
      and fiscal-resource lines fall below zero at the high end of candidate fractions; these segments expose the
      limits of the linear summary and are not plausible outcome predictions. The three panels occupy a two-by-two
      layout with the fourth slot empty. Road/light and land context use 2024, Population 2020, surveyed traffic
      2021 and actual fiscal year 2023. Municipal mesh allocation and government consolidation are unchanged. The
      383,386-mesh ledger retains 320 unavailable government links; 38 candidate meshes lack such links and are
      not reassigned. There are 66,059 linked candidates from 66,097 national candidates. All source fiscal values
      and traffic references agree with the previously verified inputs. Missing traffic stays missing, and each
      panel uses its available outcome/predictor pairs. All axes are linear and all finite outcome values are retained.
      Candidate and maintenance fractions are displayed as percentages, with source values unchanged. Zero maintenance
      values and all finite extreme values remain included. No smoothing, jitter, outcome trimming or new control
      is introduced. Contexts omitted from the previous bar figure remain part of this overall municipal aggregation.
      Surveyed traffic primarily covers major roads and does not measure all ordinary municipal roads. Territorial
      traffic and own-government fiscal spending are not matched by road ownership. Realized maintenance spending
      does not measure required or deferred maintenance, nor costs attributable to flagged roads. Tokyo special
      wards retain their distinct fiscal arrangement. These cross-sectional associations provide transport and fiscal
      context; they do not establish road overprovision, causality or a measured fiscal effect of candidate road
      stock. Export is 600 dpi.
