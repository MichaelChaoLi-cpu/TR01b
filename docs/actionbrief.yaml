    figurePath: data/results/figures/Figure_potential_mismatch_by_land_context.png
    figureCaption: Potential Mismatch by Land Context
    figurePanelCount: 2
    figureNote: "Panel a shows candidate percentages among supported meshes within Forest, Shrublands and Grasslands, Urban, Cropland and Water contexts. Panel b shows valid zero-radiance percentages among candidates in those contexts. Exact numerators and denominators accompany each bar. Barren and Incomplete coverage are omitted from this display only, with their source records retained. Percentages are descriptive, and zero radiance does not establish zero economic activity."
    figureAim: Compare candidate fractions among supported meshes and valid zero-radiance fractions among candidates
      for Forest, Shrublands and Grasslands, Urban, Cropland and Water; omit Barren and Incomplete coverage from
      this figure only.
    figureExplanation: Potential Mismatch by Land Context. Panel a reports candidate meshes as a percentage of supported
      comparison meshes within each dominant UMD land context; panel b reports meshes with valid zero Nighttime
      Radiance as a percentage of candidates in that context. Adjacent columns give each exact numerator and denominator.
      Forest, Shrublands and Grasslands, Urban, Cropland and Water are displayed. Barren and Incomplete coverage
      are omitted from this figure only under MILI-D-20261011-031; all source records and the complete seven-context
      summary remain retained. Displayed within-context counts and percentages are unchanged. Percentages are descriptive;
      no confidence interval, significance test or new model is estimated. Both panels use the same 2024 road/light
      cross-section and matched 2020 census, with 383,386 cohort meshes, 376,219 supported comparisons and 66,097
      candidates. There are 64,034 valid-zero-radiance candidates. Unavailable screening is excluded from the panel-a
      denominator and remains missing in the source. Zero denominators remain unavailable, never zero percent. All
      thirty-four Barren-context meshes lack sufficient peer support, giving zero supported and candidate meshes;
      neither Barren percentage is estimable. Incomplete coverage includes 104 cohort meshes, sixty-five supported
      meshes and fourteen candidates, so its percentages describe a small sample. Context colors match Spatial Distribution
      of Potential Mismatch. The existing peer dimensions, at-least-thirty distinct-mesh and positive-maximum-radiance
      support rule, and strict positive-road/Q75 and inclusive radiance/Q25 comparisons are unchanged under MILI-D-20261011-027.
      These are relative mismatch patterns and source-proxy diagnostics. Valid zero radiance does not prove zero
      economic activity, and candidates do not identify confirmed excessive or unused roads. Forest, through-route
      and essential-access functions remain relevant. UMD context uses largest full-mesh share with incomplete coverage
      overriding dominance; observed contexts and source zeros remain retained. Water-context meshes follow full-mesh
      footprints and may contain land and roads. Native UMD shares retain their accepted quality and mask-water
      handling. Export is 600 dpi.
