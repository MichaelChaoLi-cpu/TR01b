analysisStructureBrief:
  overview: 'Applied transportation research describing road provision and broader economic activity across Japan:
    a descriptive foundation, national pooled association, administrative and local spatial heterogeneity, comparable-context
    potential mismatch, and municipal utilization/fiscal context. Potential overprovision and maintenance pressure
    are the policy motivation, not established causal outcomes. The confirmed empirical models use an intercept
    and original scales without fixed effects. All eight figures and five tables are accepted.'
  levels:
  - levelName: Descriptive foundation
    levelAim: Establish source coverage and the spatial context of road provision and economic activity.
    inputs:
    - Nighttime Radiance
    - Road Length Density
    - Population
    - Urban Land Cover Share
    - Forest Land Cover Share
    - Cropland Land Cover Share
    - Shrublands and Grasslands
    - Water Land Cover Share
    - Distance to Railway Station
    - Distance to Passenger Airport
    - School Facility Count
    - Medical Facility Count
    - Logistics Facility Count
    - Visitor and Event Facility Count
    - Barren
    - Potential Mismatch Candidate
    - Land Context
    - Candidate Fraction of Supported Meshes
    - Length Weighted 24h Volume
    - Maintenance Share of Expenditure
    - Maintenance Share of Standard Fiscal Scale
    - Single Year Fiscal Revenue Need Ratio
    - Region
    - Prefecture
    modelOrMethod: 'Compute equal-weight mesh means for the three core variables:


      \[

      \overline V_i=\frac{1}{5}\sum_{t\in\mathcal T}V_{it}.

      \]


      Here \(i\) indexes meshes, \(\mathcal T\) the five road/light periods, \(t\) an observed period, \(V_{it}\)
      Road Length Density, matched Population or Nighttime Radiance, and \(\overline V_i\) its five-observation
      mean. Use the census matches in Section 5. These are observation means, not continuous annual averages or
      regression transformations. Facilities use selected static snapshots. The facility panel displays accepted
      source-location points for School Facility Count, Medical Facility Count, Logistics Facility Count and Visitor
      and Event Facility Count, with categories and source years distinguished; it does not create a facility total.


      Analytical Variables and Sample Coverage summarizes twenty-two confirmed substantive variables. Use panel
      records for time-varying variables, distinct meshes for static facilities and screening, and governments for
      municipal measures. Report units, source dates, valid counts, missing percentages and numerical moments. Land
      Context receives category counts and proportions. Spatial Distribution of Key Variables uses actual mesh footprints
      and three means; the fourth panel shows the selected source-location points.'
    outputs:
    - Spatial Distribution of Key Variables
    - Analytical Variables and Sample Coverage
    interpretation: Equal-weight five-observation mesh means show spatial concentrations. These are not averages
      of every intervening year. Static facilities use one selected snapshot each. Valid counts depend on statistical
      unit. Coverage does not represent every Japanese land mesh.
    evidenceSupportStatus: Descriptive foundation completed and accepted; source comparability remains limited.
    scriptPaths:
    - src/analyses/figure_spatial_distribution_of_key_variables.py
    - src/analyses/table_analytical_variables_and_sample_coverage.py
  - levelName: National conditional association
    levelAim: Assess the national road-economy association with and without observed context controls.
    inputs: &id001
    - Nighttime Radiance
    - Road Length Density
    - Population
    - Urban Land Cover Share
    - Forest Land Cover Share
    - Cropland Land Cover Share
    - Shrublands and Grasslands
    - Barren
    - Water Land Cover Share
    - Distance to Railway Station
    - Distance to Passenger Airport
    - School Facility Count
    - Medical Facility Count
    - Logistics Facility Count
    - Visitor and Event Facility Count
    modelOrMethod: 'Use the combined baseline and extension specification:


      \[

      R_{it}=\beta_{0,a,b}+\beta_{D,a,b}D_{it}+\beta_{P,a,b}P_{it}

      +b\left[\sum_{j=1}^{5}\delta_{j,a,b}\ell_{itj}

      +\sum_{m=1}^{6}\eta_{m,a,b}Z_{im}^{(s_m)}\right]+e_{it,a,b}.

      \]


      Here \(R_{it}\), \(D_{it}\) and \(P_{it}\) are Nighttime Radiance, Road Length Density and Population; \(a\)
      indexes the national sample, Region or Prefecture containing mesh \(i\); \(b\) is zero for baseline and one
      for extension; \(\beta_{0,a,b}\) is the intercept, \(\beta_{D,a,b}\) and \(\beta_{P,a,b}\) the core slopes,
      and \(e_{it,a,b}\) the residual. The shares \(\ell_{itj}\), indexed by \(j\), are Urban Land Cover Share,
      Forest Land Cover Share, Cropland Land Cover Share, Shrublands and Grasslands and Barren; \(\delta_{j,a,b}\)
      are their slopes. Water Land Cover Share is the omitted reference subject to partial coverage. The controls
      \(Z_{im}^{(s_m)}\), indexed by \(m\), are Distance to Railway Station, Distance to Passenger Airport, School
      Facility Count, Medical Facility Count, Logistics Facility Count and Visitor and Event Facility Count; \(s_m\)
      is the source edition and \(\eta_{m,a,b}\) its slope. In the baseline the bracketed terms are absent and their
      slopes unestimated. Earlier mesh and time definitions apply.


      Estimate national, regional and prefecture models independently on identical area-specific samples. Apply
      mesh-clustered CR1:


      \[

      c_{a,b}=\frac{G_a}{G_a-1}\frac{N_a-1}{N_a-K_{a,b}}.

      \]


      Here \(c_{a,b}\) is the covariance correction, \(G_a\) mesh count, \(N_a\) record count and \(K_{a,b}\) the
      actual retained parameter count including intercept: three in the baseline and at most fourteen in the extension.
      Cluster all five mesh records together, use normal 95 percent intervals and preserve unidentified core-model
      vectors. Omitted constant or redundant control slopes and their intervals remain unavailable.


      Report centered pooled fit:


      \[

      R_{a,b}^2=1-\frac{\sum_{i\in\mathcal I_a,t\in\mathcal T}\widehat e_{it,a,b}^2}

      {\sum_{i\in\mathcal I_a,t\in\mathcal T}(R_{it}-\overline R_a)^2}.

      \]


      Here \(\mathcal I_a\) is the area''s mesh set, \(\widehat e_{it,a,b}\) the fitted residual, \(\overline R_a\)
      its mean radiance and \(R_{a,b}^2\) joint fit. The comparison shares the denominator.


      Outputs are National Road Associations, Regional Road Association Comparison, Prefecture Road Association
      Comparison and Regional Road Associations and Prefecture Road Associations. The two administrative figures
      pair baseline/extended forest estimates with maps of the extended road coefficient using the frozen administrative
      areas. Use one zero-centered diverging map scale across the two figures and distinguish unavailable fits from
      zero. Colors display area estimates, not local coefficients or significance. Administrative tables have six
      columns, combine coefficients and intervals, and state five-times-mesh record counts in notes. Attempt all
      forty-seven Prefectures, including Tokyo and Nara, under the confirmed constant/redundant-control rule.


      When an additional control is redundant, retained nuisance coefficients are parameters of the selected basis
      and do not all have a common water-reference interpretation. Roads and population are reported only when uniquely
      identifiable against the complete nuisance span.'
    outputs:
    - National Road Associations
    interpretation: On the identical 383,386-mesh cohort, the road slope changes from 0.226693 in the baseline to
      0.019468 in the extension. Ordinary R-squared is 0.663260 and 0.756164, respectively; this is joint model
      fit, not the contribution of roads alone. Adding observed context changes the conditional association but
      does not establish mediation, causality or road excess.
    evidenceSupportStatus: Supporting Point 1 supported descriptively, with proxy and source-comparability limits.
    scriptPaths:
    - src/analyses/run_umd_four_layers.py
    - src/analyses/gwpr_umd_identified.py
    - src/analyses/table_national_road_associations.py
  - levelName: Administrative spatial heterogeneity
    levelAim: Describe how area-specific conditional road associations vary across Japan.
    inputs:
    - Nighttime Radiance
    - Road Length Density
    - Population
    - Urban Land Cover Share
    - Forest Land Cover Share
    - Cropland Land Cover Share
    - Shrublands and Grasslands
    - Barren
    - Water Land Cover Share
    - Distance to Railway Station
    - Distance to Passenger Airport
    - School Facility Count
    - Medical Facility Count
    - Logistics Facility Count
    - Visitor and Event Facility Count
    - Region
    - Prefecture
    modelOrMethod: 'Use the combined baseline and extension specification:


      \[

      R_{it}=\beta_{0,a,b}+\beta_{D,a,b}D_{it}+\beta_{P,a,b}P_{it}

      +b\left[\sum_{j=1}^{5}\delta_{j,a,b}\ell_{itj}

      +\sum_{m=1}^{6}\eta_{m,a,b}Z_{im}^{(s_m)}\right]+e_{it,a,b}.

      \]


      Here \(R_{it}\), \(D_{it}\) and \(P_{it}\) are Nighttime Radiance, Road Length Density and Population; \(a\)
      indexes the national sample, Region or Prefecture containing mesh \(i\); \(b\) is zero for baseline and one
      for extension; \(\beta_{0,a,b}\) is the intercept, \(\beta_{D,a,b}\) and \(\beta_{P,a,b}\) the core slopes,
