      Forest Land Cover Share, Cropland Land Cover Share, Shrublands and Grasslands and Barren; \(\delta_{j,a,b}\)
      are their slopes. Water Land Cover Share is the omitted reference subject to partial coverage. The controls
      \(Z_{im}^{(s_m)}\), indexed by \(m\), are Distance to Railway Station, Distance to Passenger Airport, School
      Facility Count, Medical Facility Count, Logistics Facility Count and Visitor and Event Facility Count; \(s_m\)
      is the source edition and \(\eta_{m,a,b}\) its slope. In the baseline the bracketed terms are absent and their
      slopes unestimated. Earlier mesh and time definitions apply.


      Estimate national, regional and prefecture models independently on identical area-specific samples. Apply
      mesh-clustered CR1:


      \[

      c_{a,b}=\frac{G_a}{G_a-1}\frac{N_a-1}{N_a-K_{a,b}}.

      \]


      Here \(c_{a,b}\) is the covariance correction, \(G_a\) mesh count, \(N_a\) record count and \(K_{a,b}\) the
      actual retained parameter count including intercept: three in the baseline and at most fourteen in the extension.
      Cluster all five mesh records together, use normal 95 percent intervals and preserve unidentified core-model
      vectors. Omitted constant or redundant control slopes and their intervals remain unavailable.


      Report centered pooled fit:


      \[

      R_{a,b}^2=1-\frac{\sum_{i\in\mathcal I_a,t\in\mathcal T}\widehat e_{it,a,b}^2}

      {\sum_{i\in\mathcal I_a,t\in\mathcal T}(R_{it}-\overline R_a)^2}.

      \]


      Here \(\mathcal I_a\) is the area''s mesh set, \(\widehat e_{it,a,b}\) the fitted residual, \(\overline R_a\)
      its mean radiance and \(R_{a,b}^2\) joint fit. The comparison shares the denominator.


      Outputs are National Road Associations, Regional Road Association Comparison, Prefecture Road Association
      Comparison and Regional Road Associations and Prefecture Road Associations. The two administrative figures
      pair baseline/extended forest estimates with maps of the extended road coefficient using the frozen administrative
      areas. Use one zero-centered diverging map scale across the two figures and distinguish unavailable fits from
      zero. Colors display area estimates, not local coefficients or significance. Administrative tables have six
      columns, combine coefficients and intervals, and state five-times-mesh record counts in notes. Attempt all
      forty-seven Prefectures, including Tokyo and Nara, under the confirmed constant/redundant-control rule.


      When an additional control is redundant, retained nuisance coefficients are parameters of the selected basis
      and do not all have a common water-reference interpretation. Roads and population are reported only when uniquely
      identifiable against the complete nuisance span.'
    outputs:
    - Regional Road Associations
    - Prefecture Road Associations
    - Regional Road Association Comparison
    - Prefecture Road Association Comparison
    interpretation: Separate same-sample fits cover nine transportation-statistics regions and forty-seven prefectures.
      Extended coefficients vary in sign and magnitude. Individual clustered intervals are not formal tests of between-area
      differences. Nuisance-basis omissions preserve mandatory core identification but can change interpretation
      of retained control slopes.
    evidenceSupportStatus: 'Supporting Point 2: descriptive geographic variation supported; no formal coefficient-difference
      test.'
    scriptPaths:
    - src/analyses/run_umd_four_layers.py
    - src/analyses/administrative_association_map_helpers.py
    - src/analyses/figure_regional_road_associations.py
    - src/analyses/figure_prefecture_road_associations.py
    - src/analyses/table_regional_road_association_comparison.py
    - src/analyses/table_prefecture_road_association_comparison.py
  - levelName: Local spatial heterogeneity
    levelAim: Describe association variation below administrative averages and show where fits are supported.
    inputs: *id001
    modelOrMethod: 'Let \(\mathbf x_{it}\) contain the intercept and thirteen extended predictors. Estimate:


      \[

      \widehat{\boldsymbol\vartheta}_{A(s,h)}

      =\arg\min_{\boldsymbol\vartheta_{A(s,h)}}\sum_{i,t}w_i(s,h)

      [R_{it}-\mathbf x_{it,A(s,h)}^\top\boldsymbol\vartheta_{A(s,h)}]^2.

      \]


      Here \(s\) is the focal centroid, \(h\) bandwidth in kilometres, \(A(s,h)\) the retained parameter set, \(\boldsymbol\vartheta_{A(s,h)}\)
      its coefficient vector, the hat its estimate, \(\mathbf x_{it,A(s,h)}\) the retained design, \(w_i(s,h)\)
      mesh weights and \(\top\) transpose. Retain intercept, mandatory roads and population, and varying added controls.


      Use bisquare weights:


      \[

      w_i(s,h)=[1-(d(s,s_i)/h)^2]^2\mathbf1\{d(s,s_i)<h\}.

      \]


      Here \(s_i\) is the mesh centroid, \(d(s,s_i)\) great-circle distance using radius 6371.0088 kilometres and
      \(\mathbf1\) an indicator. All five records share mesh weights. Final fits include their focal mesh.


      An added control is constant when its range is no greater than \(\tau\) times the larger of one and its maximum
      absolute training value; \(\tau=10^{-12}\) is the existing tolerance. Keep its slope unavailable and absorb
      its constant contribution into the intercept. Build a deterministic independent nuisance basis in the listed
      control order using twice-reorthogonalized residuals. A normalized residual norm at most \(10^{-10}\) denotes
      redundant information. Keep omitted slopes unavailable. Constant mandatory predictors or a rank-deficient
      retained design leave fits unavailable. This preserves the nuisance span rather than resolving core/control
      aliasing by dropping a substantive control. Numerical centering and scaling preserve original units and do
      not introduce fixed effects. The smallest eigenvalue of the centered column-normalized design Gram matrix
      must exceed \(10^{-12}\).


      Repeat the integer search over three to fifty kilometres, holding out all five records of each validation
      mesh and comparing:


      \[

      \operatorname{CV}(h)=

      \frac{\sum_{q\in\mathcal V}\omega_q[\frac15\sum_{t\in\mathcal T}

      (R_{qt}-\widehat R_{qt}^{(-q,h)})^2]}

      {\sum_{q\in\mathcal V}\omega_q}.

      \]


      Here \(q\) indexes validation meshes, \(\mathcal V\) the identical predictable and estimable center set, \(\omega_q\)
      tile-expansion weights, \(\widehat R_{qt}^{(-q,h)}\) held-out prediction excluding all records of mesh \(q\),
      and \(\operatorname{CV}(h)\) weighted radiance-level mean squared error. A held-out control differing from
      an omitted training constant or affine redundancy relation leaves prediction unavailable. Use the same predictable
      center set for all radii, retain tile-expansion weights and report the fraction of validation support represented.
      Changing-support scores do not rank radii.


      The completed UMD search evaluates forty-eight integer radii using 985 identical predictable validation centers,
      representing 75.252636 percent of tile-expansion weight. The conditional minimum is 5 kilometres with radiance-level
      RMSE 1.774688; this is not a proven national optimum. The full UMD surface contains 357,316 estimable and
      26,070 unavailable focal vectors. Earlier IGBP estimates retain their source identity. Retain all 383,386
      focal meshes, including failures and fewer-than-thirty-record support flags; report positive-weight and effective-weight
      meshes separately. Local Road Associations across Japan shows the coefficient surface in the main text. Local
      Road Association Estimation Support separately documents model availability and small-neighborhood flags in
      the appendix. Both use the same unchanged local results. No local significance inference is selected. Local
      training fit differs from national pooled fit and validation error.'
    outputs:
    - Local Road Associations across Japan
    - Local Road Association Estimation Support
    interpretation: Fixed-distance bisquare geographically weighted pooled regression uses five records per mesh
      and no fixed effects. The 3-50 km grouped holdout search selects 5 km on 985 common predictable centers, about
      75.25 percent of expansion weight; this is not a proven national optimum. The surface retains 357,316 estimable
      and 26,070 unavailable meshes. Thirty records are six meshes, not thirty independent spatial units. Extreme
      estimates and display saturation remain disclosed. No local coefficient uncertainty or significance map exists.
    evidenceSupportStatus: Supporting Point 2 supported descriptively on estimable neighborhoods; local precision
      and significance unestablished.
    scriptPaths:
    - src/analyses/run_umd_four_layers.py
    - src/analyses/gwpr_umd_identified.py
    - src/analyses/gwpr_pooled.py
    - src/analyses/gwpr_twoways.py
    - src/analyses/figure_local_road_associations_across_japan.py
    - src/analyses/figure_local_road_association_estimation_support.py
  - levelName: Comparable-context potential mismatch
    levelAim: Locate relative high-road/low-radiance patterns and distinguish their land backgrounds.
    inputs:
    - Potential Mismatch Candidate
    - Land Context
    - Road Length Density
    - Nighttime Radiance
    - Population
    - Region
    - Distance to Railway Station
    - School Facility Count
    - Medical Facility Count
    - Logistics Facility Count
    - Visitor and Event Facility Count
    modelOrMethod: 'Reconstruct UMD peers defined by Region; Population bands zero, 1-9, 10-49, 50-199, 200-999,
      1000-4999 and at least 5000; Land Context; presence of any four selected facility totals; and Distance to
      Railway Station bands below one, one to below five, and at least five kilometres. Retain incomplete coverage
      and any tied dominance in Land Context. Distance to Passenger Airport is not matched. Do not reoptimize peer
      rules.


      Use:


      \[

      S_i=\mathbf1\{n_{g(i)}\geq30\}\mathbf1\{\max_{j:g(j)=g(i)}R_j>0\},

      \qquad

      C_i=\begin{cases}

      \mathbf1\{D_i>0\}\mathbf1\{D_i>Q_{D,g(i)}(0.75)\}

      \mathbf1\{R_i\leq Q_{R,g(i)}(0.25)\},&S_i=1,\\

      \text{undefined},&S_i=0.

      \end{cases}

      \]


      Here \(g(i)\) is the peer stratum, \(n_{g(i)}\) its distinct-mesh count, \(S_i\) support, \(C_i\) Potential
      Mismatch Candidate, and \(D_i\) and \(R_i\) latest road density and radiance. The quantities \(Q_{D,g(i)}(0.75)\)
      and \(Q_{R,g(i)}(0.25)\) are empirical quartiles; \(j\) indexes peers in the maximum. Retain existing linear-interpolation
      quartiles, strict road and inclusive light comparisons. Undefined status stays missing. Positive-constant
      and zero lower-quartile groups receive diagnostics without new exclusions.


      The validated UMD screen has 376,219 supported meshes, 66,097 candidates and 7,167 unavailable indicators.
      All 1,499 peer groups pass independent checks. There are 172 meshes in all-zero-radiance groups, all already
      below thirty peers. Spatial Distribution of Potential Mismatch maps candidate/support states in panel a and
      UMD Land Context only for candidate meshes in panel b. Other analytical meshes remain muted background in
      panel b; all observed contexts remain in its legend with candidate counts, including zero counts. Potential
      Mismatch by Land Context shows candidate percentages among supported meshes and source-zero-radiance percentages
      among candidates with both denominators for five displayed contexts: Forest, Shrublands and Grasslands, Urban,
      Cropland and Water. Barren and Incomplete coverage are omitted from this figure only under MILI-D-20261011-031;
      their records and the complete summary remain retained. Retain seven observed UMD contexts: Urban, Forest,
      Cropland, Shrublands and Grasslands, Water, Barren and Incomplete coverage. Tied dominance remains a separate
      context if observed. These are relative patterns, not measured economic inactivity or excessive length.'
    outputs:
    - Spatial Distribution of Potential Mismatch
    - Potential Mismatch by Land Context
    interpretation: Of 376,219 supported comparisons, 66,097 are relative candidates. The 7,167 unsupported indicators
      remain missing. Candidate membership uses peer quartiles, not negative GWPR slopes. 64,034 candidates have
      valid numerical zero radiance, which does not establish economic inactivity. Five contexts are displayed in
      the bar figure; Barren and Incomplete coverage remain in data and the complete mesh map. Negative slopes or
      candidate membership do not identify inefficient provision.
    evidenceSupportStatus: 'Supporting Point 2: relative mismatch and context differences described; normative excess-road
      claims untested.'
    scriptPaths:
    - src/preprocessing/preprocess_umd_mismatch_context.py
    - src/analyses/run_umd_mismatch_screen.py
    - src/analyses/figure_spatial_distribution_of_potential_mismatch.py
    - src/analyses/figure_potential_mismatch_by_land_context.py
  - levelName: Municipal transport and fiscal context
    levelAim: Relate candidate fractions to observed utilization and own-government fiscal context.
    inputs:
    - Candidate Fraction of Supported Meshes
    - Length Weighted 24h Volume
    - Maintenance Share of Expenditure
    - Maintenance Share of Standard Fiscal Scale
    - Single Year Fiscal Revenue Need Ratio
    - Land Context
    modelOrMethod: 'For overall and context-specific scope use:


      \[

      q_{u,c}=\frac{\sum_{i\in\mathcal I_{u,c}:S_i=1}C_i}

      {\sum_{i\in\mathcal I_{u,c}}S_i}.

      \]


      Here \(u\) indexes governments, \(c\) overall scope or Land Context, \(\mathcal I_{u,c}\) assigned meshes
      and \(q_{u,c}\) Candidate Fraction of Supported Meshes. Prior support definitions apply; zero supported denominators
      stay unavailable.


      Retain:


      \[

      v_u=\frac{\sum_{k\in\mathcal K_u}l_k t_k}{\sum_{k\in\mathcal K_u}l_k},

      \qquad b_u^E=m_u/e_u,\qquad b_u^S=m_u/z_u,\qquad f_u=r_u/n_u.

      \]


      Here \(\mathcal K_u\) contains territory-coded segments with positive source length and available daily traffic;
      \(k\) indexes segments, \(l_k\) length, \(t_k\) published twenty-four-hour volume and \(v_u\) Length Weighted
      24h Volume. The amounts \(m_u\), \(e_u\), \(z_u\), \(r_u\) and \(n_u\) denote own-government road-plus-bridge
      maintenance, total expenditure, standard fiscal scale, standard fiscal revenue and standard fiscal need in
      actual FY2023, in thousand yen. The ratios \(b_u^E\), \(b_u^S\) and \(f_u\) are Maintenance Share of Expenditure,
      Maintenance Share of Standard Fiscal Scale and Single Year Fiscal Revenue Need Ratio. Empty or zero denominators
      stay missing. Source amounts explain existing constructions rather than add controls.


      For each outcome compute:


      \[

      \rho_{c,o}=\operatorname{Corr}_{u\in\mathcal U_{c,o}}

      (\operatorname{rank}(q_{u,c}),\operatorname{rank}(Y_{u,o})).

      \]


      Here \(o\) selects \(v_u\), \(b_u^E\), \(b_u^S\) or \(f_u\), \(Y_{u,o}\) is that whole-government outcome,
      \(\mathcal U_{c,o}\) the available pair set and \(\rho_{c,o}\) its Spearman correlation using average-tie
      ranks. Report pair counts: overall traffic 1,734, fiscal outcomes 1,741, and varying context counts. The user
      subsequently selects conventional Pearson p values for the three overall scatter panels; the rank-correlation
      table remains descriptive. No temporal replication is selected.


      For the three overall scatter outcomes, compute Pearson correlation and its conventional two-sided p value
      on the same original-scale available pairs:


      \[

      r_o=\operatorname{Corr}_{u\in\mathcal U_{\mathrm{all},o}}(q_{u,\mathrm{all}},Y_{u,o}),

      \qquad t_o=r_o\sqrt{\frac{N_o-2}{1-r_o^2}},

      \qquad p_o=2\Pr\left(T_{N_o-2}\geq |t_o|\right).

      \]


      Here \(r_o\) is the Pearson coefficient, \(N_o\) the available pair count, \(t_o\) the zero-correlation test
      statistic, \(T_{N_o-2}\) a Student t reference variable with \(N_o-2\) degrees of freedom and \(p_o\) the
      two-sided p value. Previously defined outcomes and available pairs apply. The test assumes independent bivariate-normal
      observations, uses no spatial or multiple-comparison correction and does not test the Spearman coefficient.
      Report the Pearson coefficient beside its p value; display values with \(p_o<0.001\) as "p < 0.1%" and retain
      exact computed values in the verification record. Treat these as conventional reference tests rather than
      evidence of a causal effect or spatially adjusted uncertainty.


      For the three overall municipal scatter panels, fit the original-scale descriptive line:


      \[

      (\widehat{a}_o,\widehat{d}_o)=\operatorname*{argmin}_{a_o,d_o}

      \sum_{u\in\mathcal U_{\mathrm{all},o}}

      \left(Y_{u,o}-a_o-d_o q_{u,\mathrm{all}}\right)^2,

      \qquad \widehat{Y}_{u,o}=\widehat{a}_o+\widehat{d}_o q_{u,\mathrm{all}}.

      \]


      Here \(a_o\) and \(d_o\) are the outcome-specific intercept and slope, and hats denote their OLS estimates.
      Reuse the available pair set and previously defined outcomes, selecting only \(v_u\), \(b_u^E\) and \(f_u\)
      for this figure. All fits use unweighted individual governments and original values without a logarithm. Display
      candidate fractions and maintenance shares as percentages; this changes display units only. Draw dashed fitted
      lines over the observed predictor range, retain all finite observations and use linear axes. These lines summarize
      unconditional linear association; they add no controls, confidence bands or causal interpretation. The separately
      displayed p values concern Pearson zero correlation, not the Spearman coefficient. Unconstrained lines can
      cross below zero within the observed predictor range; retain those segments transparently as a limitation
      of the linear summary, rather than interpret them as plausible outcome predictions.


